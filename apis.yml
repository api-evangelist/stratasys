name: Stratasys
description: >-
  Stratasys Ltd. (Nasdaq: SSYS) is a global leader in polymer additive
  manufacturing (industrial 3D printing), headquartered in Rehovot, Israel and
  Eden Prairie, Minnesota. Stratasys builds FDM, PolyJet, stereolithography (SLA),
  selective absorption fusion (SAF) and powder-bed (P3) printing systems, the
  materials that feed them, and the GrabCAD software platform that drives them.
  Its developer surface is the GrabCAD ecosystem: GrabCAD Print / GrabCAD Print
  Pro for job preparation, GrabCAD Control and GrabCAD Shop for fleet and shop
  management, and the GrabCAD Software Development Kit — a partner program of
  connectivity SDKs (Printer Connectivity SDK, MT Connect SDK, PLM SDK) that use
  standard protocols and APIs to integrate Stratasys printers with ERP, PLM, MES
  and smart-factory systems for automation, data collection and analytics.
